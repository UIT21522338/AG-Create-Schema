tables:
- name: dbo.AP_Adjust
  business_summary: 'Lưu trữ các giao dịch liên quan thanh toán công nợ mua hàng:
    bảng lưu trữ thanh toán cho các chứng từ nợ'
  entity_tags:
  - ap
  - payable
  - payment
  - vendor
  - cong_no_mua
  importance: medium
  columns:
  - name: BranchID
    business_meaning: Mã NPP
  - name: BatNbr
    business_meaning: Số Lô Nghiệp Vụ (Chứng Từ Thanh Toán)
  - name: AdjdRefNbr
    business_meaning: 'Số Tham Chiếu (chứng từ nợ)

      + Nếu từ AP10300: Lưu AdjdRefNbr = Số Tham Chiếu (tab chứng từ nợ)

      + Nếu từ AP10400: lưu AdjdRefNbr = AP_Doc.RefNbr where BatNbr = số lô nghiệp
      vụ chứng từ nợ'
  - name: AdjdBatNbr
    business_meaning: 'Số Lô Nghiệp Vụ (tab chứng từ nợ)

      + Nếu từ AP10300: Lưu AdjdBatNbr = Số Lô Nghiệp Vụ (tab chứng từ nợ)

      + Nếu từ AP10400: lưu AdjdBatNbr = AP_Doc.BatNbr where BatNbr = số lô nghiệp
      vụ chứng từ nợ'
  - name: AdjAmt
    business_meaning: 'Tiền Thanh Toán

      + Nếu từ AP10300: Lưu AdjAmt = Tiền Thanh Toán (tab Chứng Từ Nợ)

      + Nếu từ AP10400: lưu AdjAmt = Tiền Thanh Toán'
  - name: AdjdDocType
    business_meaning: 'Loại Chứng Từ Nợ

      + AC = Phiếu Báo Có

      + VO = Hóa Đơn

      + Nếu từ AP10300: Lưu AdjdDocType = AP_Doc.DocType where BatNbr = số lô nghiệp
      vụ chứng từ nợ

      + Nếu từ AP10400: lưu AdjdDocType = AP_Doc.DocType where BatNbr = số lô nghiệp
      vụ chứng từ nợ'
  - name: AdjDiscAmt
    business_meaning: Tiền Chiết Khấu
  - name: AdjgDocDate
    business_meaning: Ngày Thanh Toán
  - name: AdjgDocType
    business_meaning: 'Loại Chứng Từ Thanh Toán

      + PP = Thanh Toán Trước

      + CR = Thu Tiền NCC

      + AD = Phiếu Báo Nợ

      + HC = Thanh Toán

      + Nếu từ AP10300: Lưu Theo AP_Doc.DocType where BatNbr = số lô nghiệp vụ chứng
      từ áp

      + Nếu từ AP10400: lưu AdjgDocType = HC'
  - name: AdjgBatNbr
    business_meaning: 'Số Lô Nghiệp Vụ Thanh Toán/Áp

      + Nếu từ AP10300: Lưu AdjgBatNbr = Số Lô Nghiệp Vụ (tab chứng từ áp)

      + Nếu từ AP10400: lưu AdjgBatNbr = AP_Adjust.BatNbr (số lô nghiệp vụ thanh toán)'
  - name: AdjgRefNbr
    business_meaning: 'Số Tham Chiếu (tab chứng từ áp)

      + Nếu từ AP10300: Lưu AdjgRefNbr = Số Tham Chiếu (tab chứng từ áp)

      + Nếu từ AP10400: lưu AdjgRefNbr = AP_Adjust.RefNbr (số tham chiếu thanh toán)'
  - name: Reversal
    business_meaning: 'Đảo Ngược Thanh Toán

      + Lô thanh toán có status H và C => update Reversal = trống

      + Lô thanh toán có status V => update Reversal = NS'
  - name: VendID
    business_meaning: Mã NCC
  - name: Crtd_DateTime
    business_meaning: Ngày Tạo
  - name: Crtd_Prog
    business_meaning: Tạo Tại Màn Hình
  - name: Crtd_User
    business_meaning: Người Tạo
  - name: LUpd_DateTime
    business_meaning: Ngày Update
  - name: LUpd_Prog
    business_meaning: Update Tại Màn Hình
  - name: LUpd_User
    business_meaning: Người Update
  - name: tstamp
    business_meaning: ''
- name: dbo.AP_Balances
  business_summary: Lưu trữ tổng số dư công nợ mua hàng
  entity_tags:
  - ap
  - payable
  - vendor_balance
  - cong_no_mua
  importance: medium
  columns:
  - name: VendID
    business_meaning: Mã Nhà Cung Cấp
  - name: CurrBal
    business_meaning: 'Tổng Số Dư Nợ

      + Từ PO10200 (OrderType.ARDocType =VO,AC), AP10100 (DocType = AC): tất cả phải
      complete thì sẽ tăng số dư nợ

      + Từ PO10200 (OrderType.ARDocType = AD), AP10100 (DocType = AD), AP10200 (DocType
      = PP,CR): tất cả phải complete thì sẽ giảm số dư nợ

      + Từ AP104000 (DocType = PA and AP_Adjust.Reversal = trống): tất cả phải complete
      thì sẽ giảm số dư nợ

      + Từ AP104000 (DocType = PA and AP_Adjust.Reversal = NS): tất cả phải complete
      thì sẽ tăng số dư nợ

      + Các giao dịch trên nếu hủy sẽ thay đổi số dư nợ ngược lại'
  - name: CYInterest
    business_meaning: Kết Chuyển gì gì đó không biết
  - name: LastChkDate
    business_meaning: Ngày Thanh Toán Gần Nhất
  - name: LastVODate
    business_meaning: Ngày Hoá Đơn Gần Nhất
  - name: LUpd_DateTime
    business_meaning: Ngày Update
  - name: LUpd_Prog
    business_meaning: Update Tại Màn Hình
  - name: LUpd_User
    business_meaning: Người Update
  - name: Crtd_DateTime
    business_meaning: Ngày Tạo
  - name: Crtd_Prog
    business_meaning: Tạo Tại Màn Hình
  - name: Crtd_User
    business_meaning: Người Tạo
  - name: tstamp
    business_meaning: ''
- name: dbo.AP_Doc
  business_summary: 'Lưu trữ các giao dịch liên quan công nợ mua hàng: bảng ghi nhận
    thông tin công nợ tổng'
  entity_tags:
  - ap
  - payable
  - vendor_invoice
  - ap_document
  - cong_no_mua
  importance: medium
  columns:
  - name: BranchID
    business_meaning: Mã NPP
  - name: BatNbr
    business_meaning: 'Số Lô Nghiệp Vụ

      + Nhập từ PO10200: BatNbr = PO_Invoice.APBatNbr

      + Nhập từ AP1xxxxx: BatNbr = Tự Tăng Theo AP_Setup.PrefixBat + AP_Setup.LastBatNbr'
  - name: RefNbr
    business_meaning: 'Số Tham Chiếu

      + Nhập từ PO10200: RefNbr = PO_Invoice.APRefNbr

      + Nhập từ AP1xxxxx: RefNbr = Tự Tăng Theo AP_Setup.PrefixBat + AP_Setup.LastRefNbr'
  - name: DiscBal
    business_meaning: Tiền CK
  - name: DiscDate
    business_meaning: 'Ngày Chiết Khấu

      Đang lưu theo ngày hiện tại'
  - name: DiscTkn
    business_meaning: Không biết field này
  - name: DocBal
    business_meaning: 'Số Dư Chứng Từ

      + Lô có DocType = VO thì: DocBal = AP_Doc.OrigDocAmt - tiền đã thanh toán

      + Lô có DocType = AC thì: DocBal = AP_Doc.OrigDocAmt - tiền đã thanh toán

      + Lô có DocType = AD thì: DocBal = AP_Doc.OrigDocAmt - tiền đã cần trừ(áp) thanh
      toán

      + Lô có DocType = PP thì: DocBal = AP_Doc.OrigDocAmt - tiền đã cần trừ(áp) thanh
      toán

      + Lô có DocType = CR thì: DocBal = AP_Doc.OrigDocAmt - tiền đã cần trừ(áp) thanh
      toán

      + Lô có DocType = HC thì: DocBal = 0'
  - name: DocDate
    business_meaning: 'Ngày Chứng Từ

      + Lô đẩy từ PO10200: DocDate = PO_Invoice.DocDate

      + Lô nhập từ AP1xxxx: DocDate = lưu theo Ngày Chứng Từ'
  - name: DocDesc
    business_meaning: "Diễn Giải Chứng Từ\n+ Nhập từ PO10200:\n       Nhập/Trả Trực\
      \ Tiếp: đẩy lô công nợ lưu: DocDesc = Directly Receipt/Return\n       Nhập Từ\
      \ Đơn Đặt Hàng or Trả Từ Đơn Nhập: đẩy lô công nợ lưu: DocDesc = Receipt From\
      \ The Order, or Return From The Receipt\n+ Nhập từ AP1xxxx: DocDesc lưu theo\
      \ \"Diễn Giải Chứng Từ\""
  - name: DocType
    business_meaning: 'Loại Chứng Từ

      + AC = Phiếu Báo Có

      + AD = Phiếu Báo Nợ

      + VO = Hóa Đơn

      + HC = Thanh Toán

      + PP = Thanh Toán Trước

      + CR = Thu Tiền NCC

      + Lô đẩy từ PO10200 - Đơn Nhập: DocType = VO

      + Lô đẩy từ PO10200 - Đơn Trả: DocType = AD

      + Nhập từ AP1xxxx: DocType = Loại Chứng Từ'
  - name: DueDate
    business_meaning: 'Ngày Tới Hạn

      DueDate = AP_Doc.InvcDate + hạn thanh toán của NCC'
  - name: InvcDate
    business_meaning: 'Ngày Hóa Đơn

      + Lô đẩy từ PO10200: InvcDate = PO_Invoice.InvcDate

      + Lô nhập từ AP1xxxx: InvcDate = lưu theo Ngày Hóa Đơn'
  - name: InvcNbr
    business_meaning: 'Số Hóa Đơn

      + Lô đẩy từ PO10200: InvcNbr = PO_Invoice.InvcNbr

      + Lô nhập từ AP1xxxx: InvcNbr = lưu theo Số Hóa Đơn'
  - name: InvcNote
    business_meaning: 'Ký Hiệu Hóa Đơn

      + Lô đẩy từ PO10200: InvcNote = PO_Invoice.InvcNote

      + Lô nhập từ AP1xxxx: InvcNote = lưu theo Ký Hiệu Hóa Đơn'
  - name: NoteID
    business_meaning: Field này không dùng
  - name: OrigDocAmt
    business_meaning: 'Tiền Nợ Gốc

      + Lô đẩy từ PO10200: OrigDocAmt = PO_Receipt.RcptTotAmt

      + Lô nhập từ AP1xxxx: OrigDocAmt = lưu theo sum(AP_Doc.TxblAmt00 + AP_Doc.TaxAmt00
      + (AP_Doc.TransAmt where LineType = C))'
  - name: PONbr
    business_meaning: 'Mã Số Mua Hàng

      + Lô đẩy từ PO10200 - Nhập Trực Tiếp/Trả: PONbr = lưu trống

      + Lô đẩy từ PO10200 - Nhập từ đơn đặt hàng: PONbr = Mã Số Mua Hàng = PO_Receipt.PONbr

      + Lô nhập từ AP1xxxx: PONbr = lưu trống'
  - name: Rlsed
    business_meaning: 'Trạng Thái Lô (thể hiện theo số)

      Rlsed = 0: chờ xử lý

      Rlsed = 1: cập nhật dữ liệu

      Rlsed = -1: hủy cập nhật'
  - name: RcptNbr
    business_meaning: 'Số NK

      + Lô đẩy từ PO10200: RcptNbr = PO_Receipt.RcptNbr

      + Lô nhập từ AP1xxxx: RcptNbr = lưu trống'
  - name: TaxId00
    business_meaning: "Mã Thuế 00 (tab Thuế ở lưới 2)\n+ Lô đẩy từ PO10200: TaxId00\
      \ = PO_Receipt.TaxId00\n+ Lô nhập từ AP1xxxx: TaxId00 = AP_Trans.TaxID00 của\
      \ mã thuế 1\n\nVD: \nTab Thuế có 2 lưới 1 và 2\n- Lưới 1 có 4 dòng\n+ Dòng 1:\
      \ IVAT05, Tiền Trước Thuế = 2tr, Tiền Thuế = 200k\n+ Dòng 2: IVAT10, Tiền Trước\
      \ Thuế = 2.5tr, Tiền Thuế = 250k\n+ Dòng 3: IVAT15, Tiền Trước Thuế = 3tr, Tiền\
      \ Thuế = 300k\n+ Dòng 4: IVAT10, Tiền Trước Thuế =  4tr, Tiền Thuế = 400k\n\
      - Lưới 2 sẽ hiển thị như sau\n+ Dòng 1: IVAT05, Tiền Trước Thuế = sum các dòng\
      \ IVAT05 ở lưới 1, Tiền Thuế = sum các dòng IVAT05 ở lưới 1\n+ Dòng 2: IVAT05,\
      \ Tiền Trước Thuế = sum các dòng IVAT10 ở lưới 1, Tiền Thuế = sum các dòng IVAT10\
      \ ở lưới 1\n+ Dòng 3: IVAT05, Tiền Trước Thuế = sum các dòng IVAT15 ở lưới 1,\
      \ Tiền Thuế = sum các dòng IVAT15 ở lưới 1"
  - name: TaxId01
    business_meaning: 'Mã Thuế 01 (tab Thuế ở lưới 2)

      + Lô đẩy từ PO10200: TaxId01 = PO_Receipt.TaxId01

      + Lô nhập từ AP1xxxx: TaxId01 = AP_Trans.TaxID00 của mã thuế 2'
  - name: TaxId02
    business_meaning: 'Mã Thuế 02 (tab Thuế ở lưới 2)

      + Lô đẩy từ PO10200: TaxId02 = PO_Receipt.TaxId02

      + Lô nhập từ AP1xxxx: TaxId02 = AP_Trans.TaxID00 của mã thuế 3'
  - name: TaxId03
    business_meaning: 'Mã Thuế 03 (tab Thuế ở lưới 2)

      + Lô đẩy từ PO10200: TaxId03 = PO_Receipt.TaxId03

      + Lô nhập từ AP1xxxx: TaxId03 = AP_Trans.TaxID00 của mã thuế 4'
  - name: TaxTot00
    business_meaning: "Thuế VAT dòng 1 (tab Thuế lưới 2)\n+ Lô đẩy từ PO10200: TaxTot00\
      \ = PO_Receipt.TaxAmtTot00\n+ Lô nhập từ AP1xxxx: TaxTot00 = sum(AP_Trans.TaxAmt00\
      \ where TaxID00 = mã thuế 1)\n\nVD: \nTab Thuế có 2 lưới 1 và 2\n- Lưới 1 có\
      \ 4 dòng\n+ Dòng 1: IVAT05, Tiền Trước Thuế = 2tr, Tiền Thuế = 200k\n+ Dòng\
      \ 2: IVAT10, Tiền Trước Thuế = 2.5tr, Tiền Thuế = 250k\n+ Dòng 3: IVAT15, Tiền\
      \ Trước Thuế = 3tr, Tiền Thuế = 300k\n+ Dòng 4: IVAT10, Tiền Trước Thuế =  4tr,\
      \ Tiền Thuế = 400k\n- Lưới 2 sẽ hiển thị như sau\n+ Dòng 1: IVAT05, Tiền Trước\
      \ Thuế = sum các dòng IVAT05 ở lưới 1, Tiền Thuế = sum các dòng IVAT05 ở lưới\
      \ 1\n+ Dòng 2: IVAT05, Tiền Trước Thuế = sum các dòng IVAT10 ở lưới 1, Tiền\
      \ Thuế = sum các dòng IVAT10 ở lưới 1\n+ Dòng 3: IVAT05, Tiền Trước Thuế = sum\
      \ các dòng IVAT15 ở lưới 1, Tiền Thuế = sum các dòng IVAT15 ở lưới 1"
  - name: TaxTot01
    business_meaning: 'Thuế VAT dòng 2 (tab Thuế lưới 2)

      + Lô đẩy từ PO10200: TaxTot01 = PO_Receipt.TaxAmtTot01

      + Lô nhập từ AP1xxxx: TaxAmtTot01 = sum(AP_Trans.TaxAmt00 where TaxID00 = mã
      thuế 2)'
  - name: TaxTot02
    business_meaning: 'Thuế VAT dòng 3 (tab Thuế lưới 2)

      + Lô đẩy từ PO10200: TaxTot02 = PO_Receipt.TaxAmtTot02

      + Lô nhập từ AP1xxxx: TaxAmtTot03 = sum(AP_Trans.TaxAmt00 where TaxID00 = mã
      thuế 3)'
  - name: TaxTot03
    business_meaning: 'Thuế VAT dòng 4 (tab Thuế lưới 2)

      + Lô đẩy từ PO10200: TaxTot03 = PO_Receipt.TaxAmtTot03

      + Lô nhập từ AP1xxxx: TaxAmtTot04 = sum(AP_Trans.TaxAmt00 where TaxID00 = mã
      thuế 4)'
  - name: Terms
    business_meaning: 'Hạn Thanh Toán

      + Lô đẩy từ PO10200: Terms = PO_Invoice.Terms

      + Lô nhập từ AP1xxxx: Terms = Hạn Thanh Toán'
  - name: TxblTot00
    business_meaning: "Tiền Trước Thuế dòng 1 (tab Thuế lưới 2)\n+ Lô đẩy từ PO10200:\
      \ TxblTot00 = PO_Receipt.TxblAmtTot00\n+ Lô nhập từ AP1xxxx: TxblTot00 = sum(AP_Trans.TxblAmt00\
      \ where TaxID00 = mã thuế 1)\n\nVD: \nTab Thuế có 2 lưới 1 và 2\n- Lưới 1 có\
      \ 4 dòng\n+ Dòng 1: IVAT05, Tiền Trước Thuế = 2tr, Tiền Thuế = 200k\n+ Dòng\
      \ 2: IVAT10, Tiền Trước Thuế = 2.5tr, Tiền Thuế = 250k\n+ Dòng 3: IVAT15, Tiền\
      \ Trước Thuế = 3tr, Tiền Thuế = 300k\n+ Dòng 4: IVAT10, Tiền Trước Thuế =  4tr,\
      \ Tiền Thuế = 400k\n- Lưới 2 sẽ hiển thị như sau\n+ Dòng 1: IVAT05, Tiền Trước\
      \ Thuế = sum các dòng IVAT05 ở lưới 1, Tiền Thuế = sum các dòng IVAT05 ở lưới\
      \ 1\n+ Dòng 2: IVAT05, Tiền Trước Thuế = sum các dòng IVAT10 ở lưới 1, Tiền\
      \ Thuế = sum các dòng IVAT10 ở lưới 1\n+ Dòng 3: IVAT05, Tiền Trước Thuế = sum\
      \ các dòng IVAT15 ở lưới 1, Tiền Thuế = sum các dòng IVAT15 ở lưới 1"
  - name: TxblTot01
    business_meaning: 'Tiền Trước Thuế dòng 2 (tab Thuế lưới 2)

      + Lô đẩy từ PO10200: TxblTot01 = PO_Receipt.TxblAmtTot01

      + Lô nhập từ AP1xxxx: TxblTot01 = sum(AP_Trans.TxblAmt00 where TaxID00 = mã
      thuế 2)'
  - name: TxblTot02
    business_meaning: 'Tiền Trước Thuế dòng 3 (tab Thuế lưới 2)

      + Lô đẩy từ PO10200: TxblTot02 = PO_Receipt.TxblAmtTot02

      + Lô nhập từ AP1xxxx: TxblTot02 = sum(AP_Trans.TxblAmt00 where TaxID00 = mã
      thuế 3)'
  - name: TxblTot03
    business_meaning: 'Tiền Trước Thuế dòng 4 (tab Thuế lưới 2)

      + Lô đẩy từ PO10200: TxblTot03 = PO_Receipt.TxblAmtTot03

      + Lô nhập từ AP1xxxx: TxblTot03 = sum(AP_Trans.TxblAmt00 where TaxID00 = mã
      thuế 4)'
  - name: VendID
    business_meaning: 'Mã Nhà Cung Cấp

      + Lô đẩy từ PO10200: VendID = PO_Receipt.VendID

      + Lô nhập từ AP1xxxx: VendID = mã nhà cung cấp'
  - name: Crtd_DateTime
    business_meaning: Ngày Tạo
  - name: Crtd_Prog
    business_meaning: Tạo Tại Màn Hình
  - name: Crtd_User
    business_meaning: Người Tạo
  - name: LUpd_DateTime
    business_meaning: Ngày Update
  - name: LUpd_Prog
    business_meaning: Update Tại Màn Hình
  - name: LUpd_User
    business_meaning: Người Update
  - name: tstamp
    business_meaning: ''
- name: dbo.AP_Trans
  business_summary: 'Lưu trữ các giao dịch liên quan công nợ mua hàng: bảng ghi nhận
    thông tin công nợ chi tiết'
  entity_tags:
  - ap
  - payable
  - vendor_invoice_line
  - ap_transaction
  - cong_no_mua
  importance: medium
  columns:
  - name: BranchID
    business_meaning: Mã NPP
  - name: BatNbr
    business_meaning: 'Số Lô Nghiệp Vụ

      Tự Tăng Theo AP_Setup.PrefixBat + AP_Setup.LastBatNbr'
  - name: RefNbr
    business_meaning: 'Số Tham Chiếu

      Tự Tăng Theo AP_Setup.PrefixBat + AP_Setup.LastRefNbr'
  - name: LineRef
    business_meaning: Số Thứ Tự Dòng
  - name: Addr
    business_meaning: 'Địa Chỉ

      Field này hiện lưu trống'
  - name: InvcNbr
    business_meaning: 'Số Hóa Đơn

      Field này hiện lưu trống'
  - name: InvcNote
    business_meaning: 'Ký Hiệu Hóa Đơn

      Field này hiện lưu trống'
  - name: InvtID
    business_meaning: "Mã Sản Phẩm\n+ Lô từ PO10200 đẩy qua:\n      Các dòng nhập:\
      \ InvtID = PO_Trans.InvtID với AP_Trans.LineType = R\n      Các dòng phí: InvtID\
      \ = PO_Trans.InvtID với AP_Trans.LineType = C (nếu sản phẩm có IN_Inventory.POFee\
      \ <> 0)\n      Một dòng tổng: InvtID = lưu trống, với AP_Trans.TranClass = N\
      \ (dòng này tự phát sinh)\n+ Nhập từ AP1xxxx:\n      Các dòng nhập trên màn\
      \ hình: InvtID = Mã Sản Phẩm\n      Một dòng tổng: InvtID = lưu trống, với AP_Trans.TranClass\
      \ = N (dòng này tự phát sinh)"
  - name: InvcDate
    business_meaning: 'Ngày Hóa Đơn

      + Lô đẩy từ PO10200: DocDate = PO_Invoice.InvcDate

      + Lô nhập từ AP1xxxx: DocDate = lưu theo Ngày Hóa Đơn'
  - name: JrnlType
    business_meaning: "Giao Dịch Từ Phân Hệ Nào Đẩy Qua\n+ Từ PO10200\n       Đẩy\
      \ lô công nợ = PO\n+ Từ AP1xxxx = AP"
  - name: LineType
    business_meaning: "Kiểu Nhập\n+ C = Phụ Thu\n+ D = Mua Trực Tiếp\n+ F = Chi Phí\
      \ Vận Chuyển\n+ N = Hóa Đơn Nợ\n+ R = Nhập Kho\n+ S = Mua Hàng\n+ T = Thuế\n\
      + X = Tài Sản Cố Định\n+ Lô từ PO10200 đẩy vào:\n       Dòng chi tiết sản phẩm\
      \ lưu: LineType = R\n       Dòng phí (tách ra từ sản phẩm có POFee) lưu: LineType\
      \ = C\n       Dòng tổng tự phát sinh lưu: LineType = R\n+ Nhập từ AP1xxxx:\n\
      \       Dòng nhập: LineType = lưu theo \"Kiểu Nhập\"\n       Dòng tổng tự phát\
      \ sinh lưu: LineType = lưu trống"
  - name: POLineRef
    business_meaning: "Dòng trên lô PO\n+ Lô từ PO10200 đẩy vào: \n      Các dòng\
      \ sản phẩm = dòng trên PO\n      Dòng tổng = lưu trống\n+ Nhập từ AP1xxxx =\
      \ lưu trống"
  - name: PONbr
    business_meaning: "Mã Số Mua Hàng\n+ Lô đẩy từ PO10200 - Nhập Trực Tiếp/Trả:\n\
      \      Các dòng sản phẩm = lưu trống\n      Dòng tổng = lưu trống\n+ Lô đẩy\
      \ từ PO10200 - Nhập từ đơn đặt hàng:\n      Các dòng sản phẩm = PO_Trans.PONbr\n\
      \      Dòng tổng = lưu trống\n+ Lô nhập từ AP1xxxx: PONbr = lưu trống"
  - name: Qty
    business_meaning: "Số Lượng\n+ Lô từ PO10200 đẩy vào:\n       Dòng chi tiết sản\
      \ phẩm lưu: Qty = PO_Trans.RcptQty\n       Dòng phí (tách ra từ sản phẩm có\
      \ POFee) lưu: Qty = 0\n       Dòng tổng tự phát sinh lưu: Qty = 0\n+ Nhập từ\
      \ AP1xxxx:\n       Dòng nhập: Qty = lưu theo \"Số Lượng\"\n       Dòng tổng\
      \ tự phát sinh lưu: Qty = 0"
  - name: TaxAmt00
    business_meaning: "Thuế VAT (ở tab Thuế lưới 1)\n+ Lô từ PO10200 đẩy vào:\n  \
      \     Dòng chi tiết sản phẩm lưu: TaxAmt00 = PO_Trans.TaxAmt00\n       Dòng\
      \ phí (tách ra từ sản phẩm có POFee) lưu: TaxAmt00 = 0\n       Dòng tổng tự\
      \ phát sinh lưu: TaxAmt00 = 0\n+ Nhập từ AP1xxxx: SI_Tax.PrcTaxIncl = 0 TaxAmt00\
      \ = TxblAmt00 * %Thuế\n+ Nếu không thỏa thuế thì: TaxAmt00 = 0"
  - name: TaxAmt01
    business_meaning: 'Thuế VAT

      Tạm thời không dùng'
  - name: TaxAmt02
    business_meaning: 'Thuế VAT

      Tạm thời không dùng'
  - name: TaxAmt03
    business_meaning: 'Thuế VAT

      Tạm thời không dùng'
  - name: TaxCat
    business_meaning: 'Loại Thuế

      + Lô từ PO10200 đẩy vào: TaxCat = PO_Trans.TaxCat

      + Nhập từ AP1xxxx: TaxCat = lưu theo Loại Thuế'
  - name: TaxId00
    business_meaning: "Mã Thuế (ở tab Thuế lưới 1)\n+ Lô từ PO10200 đẩy vào:\n   \
      \    Dòng chi tiết sản phẩm lưu: TaxId00 = PO_Trans.TaxId00\n       Dòng phí\
      \ (tách ra từ sản phẩm có POFee) lưu: TaxId00 = lưu trống\n       Dòng tổng\
      \ tự phát sinh lưu: TaxId00 = lưu trống\n+ Nhập từ AP1xxxx:TaxID00 = lưu theo\
      \ Mã Thuế"
  - name: TaxId01
    business_meaning: 'Mã Thuế

      Tạm thời không dùng'
  - name: TaxId02
    business_meaning: 'Mã Thuế

      Tạm thời không dùng'
  - name: TaxId03
    business_meaning: 'Mã Thuế

      Tạm thời không dùng'
  - name: TranAmt
    business_meaning: "Thành Tiền\n+ Lô từ PO10200 đẩy vào:\n       Dòng chi tiết\
      \ sản phẩm lưu: TranAmt = PO_Trans.TranAmt\n       Dòng phí (tách ra từ sản\
      \ phẩm có POFee) lưu: TranAmt = PO_Trans.RcptFee\n       Dòng tổng tự phát sinh\
      \ lưu: TranAmt = sum(AP_Trans.TranAmt where TranClass = trống)\n+ Nhập từ AP1xxxx:\
      \ \n       Có nhập sản phẩm và số lượng: TranAmt = (SL * Giá) = (AP_Trans.Qty\
      \ * AP_Trans.UnitPrice)\n       Không nhập sản phẩm: TranAmt = lưu theo \"Thành\
      \ Tiền\"\n       Dòng tổng tự phát sinh lưu: TranAmt = sum(AP_Trans.TranAmt\
      \ where TranClass = trống)"
  - name: TranClass
    business_meaning: 'Loại Dòng

      + TranClass = trống: dòng chi tiết

      + TranClass = N: dòng tổng, dòng này luôn tự phát sinh khi lưu'
  - name: TranDate
    business_meaning: 'Ngày Chứng Từ

      + Lô đẩy từ PO10200: TranDate = PO_Invoice.DocDate

      + Lô nhập từ AP1xxxx: TranDate = lưu theo Ngày Chứng Từ'
  - name: TranDesc
    business_meaning: "Diễn Giải\n+ Lô đẩy từ PO10200:\n       Dòng chi tiết sản phẩm\
      \ lưu: TranDesc = PO_Trans.TranDesc\n       Dòng phí (tách ra từ sản phẩm có\
      \ POFee) lưu: TranDesc = lưu cứng dòng \"Phí Xăng Dầu\"\n       Dòng tổng tự\
      \ phát sinh lưu: TranDesc = lưu trống\n+ Lô nhập từ AP1xxxx: DocDate = lưu theo\
      \ Ngày Chứng Từ\n       Dòng tự nhập: TranDesc = lưu theo \"Diễn Giải\"\n  \
      \     Dòng tổng tự phát sinh lưu: TranDesc = lưu trống"
  - name: TranType
    business_meaning: 'Loại Chứng Từ

      + AC = Phiếu Báo Có

      + AD = Phiếu Báo Nợ

      + VO = Hóa Đơn

      + HC = Thanh Toán

      + PP = Thanh Toán Trước

      + CR = Thu Tiền NCC

      + Lô đẩy từ PO10200 - Nhập: TranType = VO

      + Lô đẩy từ PO10200 - Trả: TranType = AD

      + Nhập từ AP1xxxx: TranType = Loại Chứng Từ'
  - name: TxblAmt00
    business_meaning: "Tiền Trước Thuế (ở tab Thuế lưới 1)\n+ Lô từ PO10200 đẩy vào:\n\
      \       Dòng chi tiết sản phẩm lưu: TxblAmt00 = PO_Trans.TxblAmt00\n       Dòng\
      \ phí (tách ra từ sản phẩm có POFee) lưu: TxblAmt00 = 0\n       Dòng tổng tự\
      \ phát sinh lưu: TxblAmt00 = 0\n+ Nhập từ AP1xxxx: \n      ++ Nếu setup Trước\
      \ Thuế (SI_Tax.PrcTaxIncl = 0)\n                 TxblAmt00 = AP_Trans.TransAmt\n\
      \       ++ Nếu setup Sau Thuế (SI_Tax.PrcTaxIncl = 1)\n                 TxblAmt00\
      \ = AP_Trans.TransAmt / (1 + %Thuế)\n+ Nếu không thỏa thuế thì: TxblAmt00 =\
      \ AP_Trans.TranAmt"
