  - name: RcptBatNbr
    business_meaning: "Số lô nghiệp vụ nhận hàng\n+ Lô chuyển 1 bước = lưu trống\n\
      + Lô chuyển 2 bước\n        Khi IN10100 nhập hàng status H => RcptBatNbr: lưu\
      \ trống\n        Khi IN10100 nhập hàng status C => RcptBatNbr: lưu theo \"số\
      \ lô nghiệp vụ lô nhận\""
  - name: RcptDate
    business_meaning: "Ngày nhận hàng\n+ Lô chuyển 1 bước = lưu 1900-01-01\n+ Lô chuyển\
      \ 2 bước\n        Khi IN10100 nhập hàng status H => RcptBatNbr: lưu 1900-01-01\n\
      \        Khi IN10100 nhập hàng status C => RcptBatNbr: lưu theo \"Ngày giao\
      \ dịch ở IN10100\""
  - name: RcptNbr
    business_meaning: "Người nhận hàng\n+ Lô chuyển 1 bước = lưu trống\n+ Lô chuyển\
      \ 2 bước\n        Khi IN10100 nhập hàng status H => RcptBatNbr: lưu trống\n\
      \        Khi IN10100 nhập hàng status C => RcptBatNbr: lưu \"user nhập kho ở\
      \ IN10100\""
