  - name: TaxAmtTot00
    business_meaning: "Thuế VAT dòng 1 (tab Thuế lưới 2)\n- TaxAmtTot00 = sum(PO_Trans.TaxAmt00\
      \ where TaxID00 = mã thuế 1)\n\nVD: \nTab Thuế có 2 lưới 1 và 2\n- Lưới 1 có\
