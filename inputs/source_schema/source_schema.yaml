      \ = G thì DiscClass có:\n    II = Sản Phẩm\n    IC = Sản Phẩm và Kênh\n    GI\
      \ = Sản Phẩm và Nhóm Khách Hàng\n    I1 = Sản Phẩm và Loại Điểm Bán\n    CI\
