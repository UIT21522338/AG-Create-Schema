      \ + IN_Setup.LastBatNbr\n+ Tại OM10100:\n       Đẩy lô kho: BatNbr = OM_SalesOrd.INBatNbr\n\
      + Tại PO10200\n       Đẩy lô kho: tự tăng theo IN_Setup.PrefixBat + IN_Setup.LastBatNbr"
  - name: RefNbr
    business_meaning: "\"Kỳ Cập Nhật/Số NK\" / \"Số Tham Chiếu\" / \"Kỳ Cập Nhật/Số\
      \ Tham Chiếu\"\n+ Tại IN10100: lưu theo field Kỳ Cập Nhật/Số NK\n       Tự tăng\
      \ theo: IN_Setup.PrefixBat + IN_Setup.LastRefNbr\n+ Tại IN10200: lưu theo field\
      \ Kỳ Cập Nhật/Số Tham Chiếu\n       Tự tăng theo: IN_Setup.PrefixBat + IN_Setup.LastRefNbr\n\
      + Tại IN10300 - 1 bước: lưu theo field Số Tham Chiếu\n       Tự tăng theo: IN_Setup.PrefixBat\
      \ + IN_Setup.LastRefNbr\n+ Tại IN10300 - 2 bước: \n       Lô chuyển: lưu theo\
      \ field Số Tham Chiếu - tự tăng theo: IN_Setup.PrefixBat +  IN_Setup.LastRefNbr\n\
      \       Lô nhập: lưu theo field Số Chuyển Kho (= IN_Transfer.TrnsfrDocNbr)\n\
      + Tại IN10400: lưu theo field Số Tham Chiếu\n       Tự tăng theo: IN_Setup.PrefixBat\
      \ + IN_Setup.LastRefNbr\n+ Tại OM10100:\n       Đẩy lô kho: lưu theo field Kỳ\
      \ Cập Nhật/Số Tham Chiếu - tự tăng theo OM_DocNumbering.PrefixShip + OM_DocNumbering.LastShipperNbr\n\
      + Tại PO10200\n       Đẩy lô kho: lưu theo field Kỳ Cập Nhật/Số NK - tự tăng\
      \ theo PO_Setup.PrefixBat + PO_Setup.LastRcptNbr"
