    business_meaning: 'Nguồn

      Source = lưu IN'
  - name: Status
    business_meaning: "Tình Trạng Chuyển Kho\n+ Lô chuyển 1 bước:\n        P = Pending\
      \ (kho chuyển đi chưa hoàn tất: giảm QtyAvail & tăng QtyAllocIN, chưa nhập vào\
      \ kho nhận)\n        R = Receipt (kho chuyển đi hoàn tất: giảm QtyAllocIN &\
      \ giảm QtyOnHand, đã nhập hàng vào kho nhận)\n+ Lô chuyển 2 bước\n        P\
      \ = Pending (kho chuyển đi chưa hoàn tất: giảm QtyAvail & tăng QtyAllocIN, chưa\
      \ nhập vào kho nhận)\n        I = Pending (kho chuyển đi hoàn tất: giảm QtyAllocIN\
      \ & giảm QtyOnHand & tăng QtyInTransit, chưa nhập vào kho nhận)\n        R =\
      \ Receipt (kho chuyển đi hoàn tất: giảm QtyInTransit, đã nhập hàng vào kho nhận:\
      \ tăng QtyAvail, tăng QtyOnHand)"
