- name: dbo.OM_LotTrans
  business_summary: 'Lưu trữ danh sách Đơn Hàng Bán Hàng Đã Giao/Bán Trực Tiếp: table
    lưu trữ chi tiết lot'
  entity_tags:
  - sales
  - order_lot
  - sellout_line_lot
  - fact_detail
  importance: medium
  columns:
  - name: BranchID
    business_meaning: Mã NPP
  - name: OrderNbr
    business_meaning: "Số Đơn Hàng\n+ OrderNbr sẽ tự tăng theo nguyên tắc (OM_DocNumbering.PreFixSO\
      \ + OM_DocNumbering.LastOrderNbr where orderType = kiểu đơn hàng đang tạo)\n\
      + Sẽ có 4 nới đẩy đơn hàng như sau:\n    ++ Từ OM20500 đẩy vào\n    ++ Từ build\
      \ Giao hàng đẩy vào\n    ++ Từ bán hàng vansales đẩy vào\n    ++ Tạo trực tiếp\
      \ ở OM10100"
  - name: LotSerNbr
    business_meaning: 'Số Lot/Serial

      + Từ OM20500 đẩy vào: LotSerNbr = OM_PDALotTrans.LotSerNbr lần vừa duyệt

      + Từ OM10100: LotSerNbr = Số Lot/Serial'
  - name: OMLineRef
    business_meaning: 'Số thứ tự dòng OM_SalesOrdDet

      Lưu theo OM_SalesOrdDet.LineRef'
  - name: UnitDesc
    business_meaning: 'Đơn Vị Tính

      + Từ OM20500 đẩy vào: UnitDesc = OM_PDALotTrans.UnitDesc lần vừa duyệt

      + Từ OM10100: UnitDesc = Đơn Vị Tính'
  - name: ExpDate
    business_meaning: 'Ngày Hết Hạn

      + Từ OM20500 đẩy vào: ExpDate = OM_PDALotTrans.ExpDate lần vừa duyệt

      + Từ OM10100: ExpDate = Ngày Hết Hạn'
  - name: InvtID
    business_meaning: 'Mã Sản Phẩm

      + Từ OM20500 đẩy vào: InvtID = OM_PDALotTrans.InvtID lần vừa duyệt

      + Từ OM10100: InvtID = Mã Sản Phẩm'
  - name: InvtMult
    business_meaning: "Loại Tăng/Giảm Kho trên từng dòng \"Sản Phẩm - Lot\"\nInvtMult\
      \ = 1: Tăng Kho\nInvtMult = -1: Giảm Kho \n+ Từ OM20500 đẩy vào: InvtMult =\
      \ -1\n+ Từ OM10100 - đơn bán ra: InvtMult = -1\n+ Từ OM10100 - đơn trả: InvtMult\
      \ = 1"
  - name: MfgrLotSerNbr
    business_meaning: 'Số Lot/Serial SX

      + Từ OM20500 đẩy vào: MfgrLotSerNbr = OM_PDALotTrans.MfgrLotSerNbr lần vừa duyệt

      + Từ OM10100: MfgrLotSerNbr = Số Lot/Serial SX'
  - name: CnvFact
    business_meaning: "Hệ Số Quy Đổi\n+ Từ OM20500 đẩy vào: CnvFact = OM_PDALotTrans.CnvFact\
      \ lần vừa duyệt\n+ Từ OM10100: CnvFact = hệ số quy đổi\nVD:\n- Setup SP A: \n\
      \   Đơn vị lưu kho = CHAI, Đơn vị khác = CHAI, Hệ Số = 1\n   Đơn vị lưu kho\
      \ = CHAI, Đơn vị khác = THUNG, Hệ Số = 24\n- Lô nghiệp vụ nếu chọn SP A, Đơn\
      \ Vị CHAI => lưu CnvFact = 1\n  Lô nghiệp vụ nếu chọn SP A, Đơn Vị THUNG =>\
      \ lưu CnvFact = 24"
  - name: UnitMultDiv
    business_meaning: "Toán Tử\nM = Phép nhân\nD = Phép chia\n+ Từ OM20500 đẩy vào:\
      \ UnitMultDiv = OM_PDALotTrans.UnitMultDiv lần vừa duyệt\n+ Từ OM10100: UnitMultDiv\
      \ = Toán Tử\nVD: \n- Setup SP A: \n   Đơn vị lưu kho = CHAI, Đơn vị khác = CHAI,\
      \ Hệ Số = 1, Toán Tử = M\n   Đơn vị lưu kho = CHAI, Đơn vị khác = THUNG, Hệ\
      \ Số = 24, Toán Tử = M\n- Lô nghiệp vụ nếu chọn SP A, Đơn Vị CHAI => lưu InvtMult\
      \ = M\n  Lô nghiệp vụ nếu chọn SP A, Đơn Vị THUNG => lưu InvtMult = M"
  - name: Qty
    business_meaning: 'Số Lượng

      + Từ OM20500 đẩy vào: Qty = OM_PDALotTrans.Qty lần vừa duyệt

      + Từ OM10100: Qty = Số Lượng trong popup lot'
  - name: SiteID
    business_meaning: 'Mã Kho

      + Từ OM20500 đẩy vào: SiteID = OM_PDALotTrans.SiteID lần vừa duyệt

      + Từ OM10100: SiteID = Mã Kho'
  - name: TranDate
    business_meaning: 'Ngày Chứng Từ

      + Từ OM20500 đẩy vào: TranDate = OM_PDALotTrans.TranDate lần vừa duyệt

      + Từ OM10100: TranDate = OM_SalesOrd.ARDocDate'
  - name: INDocType
    business_meaning: 'Kiểu Chứng Từ IN

      + Từ OM20500 đẩy vào: INDocType = OM_PDALotTrans.INDocType lần vừa duyệt

      + Từ OM10100: INDocType = OM_OrderType.INDocType where OrderType = OM_SalesOrd.OrderType'
  - name: UnitCost
    business_meaning: 'Giá Bán

      + Từ OM20500 đẩy vào: UnitCost = OM_PDALotTrans.UnitCost lần vừa duyệt

      + Từ OM10100: UnitCost = OM_SalesOrd.SlsPrice'
  - name: UnitPrice
    business_meaning: 'Giá Bán

      + Từ OM20500 đẩy vào: UnitPrice = OM_PDALotTrans.UnitPrice lần vừa duyệt

      + Từ OM10100: UnitPrice = OM_SalesOrd.SlsPrice'
  - name: WarrantyDate
    business_meaning: 'Ngày Sử Dụng

      + Từ OM20500 đẩy vào: WarrantyDate = OM_PDALotTrans.WarrantyDate lần vừa duyệt

      + Từ OM10100: WarrantyDate = Ngày Sử Dụng'
  - name: Crtd_Prog
    business_meaning: 'Tạo Tại Màn Hình

      + Từ OM20500 đẩy vào: Crtd_Prog = OM20500

      + Từ OM10100: Crtd_Prog = OM10100'
  - name: Crtd_User
    business_meaning: 'Người Tạo

      + Từ OM20500 đẩy vào: Crtd_User = người duyệt

      + Từ OM10100: Crtd_User = user tạo đơn hàng'
  - name: Crtd_DateTime
    business_meaning: 'Ngày Tạo

      + Từ OM20500 đẩy vào: Crtd_DateTime = ngày duyệt

      + Từ OM10100: Crtd_DateTime = ngày tạo đơn hàng'
  - name: LUpd_Prog
    business_meaning: 'Update Tại Màn Hình

      + Từ OM20500 đẩy vào: Lupd_Prog = OM20500

      + Từ OM10100: Lupd_Prog = OM10100'
  - name: LUpd_User
    business_meaning: 'Người Update

      + Từ OM20500 đẩy vào: LUpd_User = người duyệt

      + Từ OM10100: LUpd_User = user edit'
  - name: LUpd_DateTime
    business_meaning: 'Ngày Update

      + Từ OM20500 đẩy vào: LUpd_DateTime = ngày duyệt

      + Từ OM10100: LUpd_DateTime = ngày edit'
  - name: tstamp
    business_meaning: ''
  - name: ToWhseLoc
    business_meaning: Field này không dùng
  - name: WhseLoc
    business_meaning: Field này không dùng
