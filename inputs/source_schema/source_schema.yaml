    business_meaning: "Mua Hàng\nĐây là số lượng treo trong mua hàng ở PO10100\n+\
      \ Từ PO10100:\n     Status H,W1,M: tăng QtyOnPO\n     Status X,O,C: giảm QtyOnPO\n\
      + Từ PO10200 nhập hàng từ đơn đặt hàng:\n     Status H: không đổi\n     Status\
      \ V: không đổi\n     Status C: giảm QtyOnPO (nếu nhập hết thì update PO_Header.Status\
      \ = C, nếu nhập 1 phần thì update PO_Header.Status = O)\n+ Từ INxxxxx, OMxxxxx:\
