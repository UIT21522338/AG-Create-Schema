      TaxID00 = OM_SalesOrdDet.TaxID00 của mã thuế 1

      VD:

      Tab Thuế có 2 lưới 1 và 2

      - Lưới 1 có 4 dòng

      + Dòng 1: IVAT05, Tiền Trước Thuế = 2tr, Tiền Thuế = 200k

