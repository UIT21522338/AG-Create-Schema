      \ Tiền Thuế = 200k\n+ Dòng 2: IVAT10, Tiền Trước Thuế = 2.5tr, Tiền Thuế = 250k\n\
      + Dòng 3: IVAT15, Tiền Trước Thuế = 3tr, Tiền Thuế = 300k\n+ Dòng 4: IVAT10,\
      \ Tiền Trước Thuế =  4tr, Tiền Thuế = 400k\n- Lưới 2 sẽ hiển thị như sau\n+\
      \ Dòng 1: IVAT05, Tiền Trước Thuế = sum các dòng IVAT05 ở lưới 1, Tiền Thuế\
      \ = sum các dòng IVAT05 ở lưới 1\n+ Dòng 2: IVAT05, Tiền Trước Thuế = sum các\
      \ dòng IVAT10 ở lưới 1, Tiền Thuế = sum các dòng IVAT10 ở lưới 1\n+ Dòng 3:\
      \ IVAT05, Tiền Trước Thuế = sum các dòng IVAT15 ở lưới 1, Tiền Thuế = sum các\
      \ dòng IVAT15 ở lưới 1"
