- name: dbo.OM_Invoice
  business_summary: 'Lưu trữ danh sách Đơn Hàng Bán Hàng Đã Giao/Bán Trực Tiếp: table
    lưu trữ hóa đơn'
  entity_tags:
  - sales
  - invoice
  - sellout
  - hoa_don_ban_hang
  - fact_header
  importance: high
  columns:
  - name: BranchID
    business_meaning: Mã NPP
  - name: RefNbr
    business_meaning: 'Số Tham Chiếu

      + Từ OM20500 đẩy vào: RefNbr  = tự tăng theo nguyên tắc (OM_DocNumbering.PreFixIN
      + OM_DocNumbering.LastShipperNbr)

      + Từ build Giao hàng đẩy vào: RefNbr  = tự tăng theo nguyên tắc (OM_DocNumbering.PreFixIN
      + OM_DocNumbering.LastShipperNbr)

      + Từ bán hàng vansales đẩy vào: RefNbr  = tự tăng theo nguyên tắc (OM_DocNumbering.PreFixIN
      + OM_DocNumbering.LastShipperNbr)

      + Từ OM10100 or OM40200 change status từ N thành I: RefNbr  = tự tăng theo nguyên
      tắc (OM_DocNumbering.PreFixIN + OM_DocNumbering.LastShipperNbr)'
  - name: InvcNbr
    business_meaning: 'Số Hóa Đơn

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: InvcNbr  = OM_PDASalesOrd.InvcNbr

      + Từ OM10100 or OM40200 change status từ N thành I: InvcNbr = Số Hóa Đơn'
  - name: InvcNote
    business_meaning: 'Ký Hiệu Hóa Đơn

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: InvcNote  = OM_PDASalesOrd.InvcNote

      + Từ OM10100 or OM40200 change status từ N thành I: InvcNbr = Ký Hiệu Hóa Đơn'
  - name: DocType
    business_meaning: 'Loại Chứng Từ Công Nợ Bán Ra

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: DocType  = OM_OrderType.ARDocType
      where OrderType = OM_PDASalesOrd.OrderType

      + Từ OM10100 or OM40200 change status từ N thành I: DocType = OM_OrderType.ARDocType
      where OrderType = Kiểu Đơn Hàng'
  - name: CustID
    business_meaning: 'Mã Khách Hàng

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: CustID  = OM_PDASalesOrd.CustID

      + Từ OM10100 or OM40200 change status từ N thành I: CustID = Mã KH'
  - name: BatNbr
    business_meaning: 'Số Lô Nghiệp Vụ Công Nợ Bán Ra

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: BatNbr = tự tăng theo AR_Setup.PreFixBat
      + AR_Setup.LastBatNbr

      + Từ OM10100 or OM40100 change status từ I thành C: BatNbr = tự tăng theo AR_Setup.PreFixBat
      +AR_Setup.LastBatNbr

      + Từ OM10100 or OM40200 change status từ N thành I: BatNbr = trống'
  - name: OrigBatNbr
    business_meaning: Field này không dùng
  - name: OrigINBatNbr
    business_meaning: Field này không dùng
  - name: INBatNbr
    business_meaning: 'Số Lô Nghiệp Vụ Kho

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: INBatNbr = tự tăng theo IN_Setup.PreFixBat
      + IN_Setup.LastBatNbr

      + Từ OM10100 or OM40100 change status từ I thành C: INBatNbr = tự tăng theo
      IN_Setup.PreFixBat + IN_Setup.LastBatNbr

      + Từ OM10100 or OM40200 change status từ N thành I: INBatNbr = trống'
  - name: INDocType
    business_meaning: 'Loại Chứng Từ Kho

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: INDocType  = OM_OrderType.INDocType
      where OrderType = OM_PDASalesOrd.OrderType

      + Từ OM10100 or OM40200 change status từ N thành I: INDocType = OM_OrderType.INDocType
      where OrderType = Kiểu Đơn Hàng'
  - name: SlsPerID
    business_meaning: 'Mã Nhân Viên Bán Hàng

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: SlsperID = OM_PDASalesOrd.SlsperID

      + Từ OM10100 or OM40200 change status từ N thành I: SlsperID = Mã Nhân Viên
      Bán Hàng'
  - name: DeliveryID
    business_meaning: 'Mã Nhân Viên Giao Hàng

      + Từ OM20500 đẩy vào: DeliveryID = Mã Nhân Viên Giao Hàng chọn ở popup

      + Từ Giao Hàng/Bán Hàng VanSales đẩy vào: DeliveryID = OM_PDASalesOrd.DeliveryID

      + Từ OM10100 or OM40200 change status từ N thành I: DeliveryID = Mã Nhân Viên
      Giao Hàng'
  - name: Terms
    business_meaning: 'Hạn Thanh Toán

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: Terms = OM_PDASalesOrd.Terms

      + Từ OM10100 or OM40200 change status từ N thành I: Terms = Hạn Thanh Toán'
  - name: DocDate
    business_meaning: 'Ngày Hóa Đơn

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: DocDate = OM_PDASalesOrd.DocDate

      + Từ OM10100 or OM40200 change status từ N thành I: DocDate = Ngày Hóa Đơn'
  - name: DueDate
    business_meaning: 'Ngày Tới Hạn

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: DocDate = OM_PDASalesOrd.ARDocDate
      + OM_PDASalesOrd.Terms

      + Từ OM10100 or OM40200 change status từ N thành I: DocDate = OM_Invoice.DocDate
      + OM_Invoice.Terms'
  - name: DiscDate
    business_meaning: 'Ngày Chiết Khấu

      Field này không dùng

      Hiện tại thấy lưu ngày hiện tại'
  - name: DocAmt
    business_meaning: 'Thành Tiền (đã giảm trừ chiết khấu nhóm và chiết khấu chứng
      từ và bao gồm thuế => đây là tiền cuối cùng mà KH phải trả)

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: DocAmt = OM_PDASalesOrd.OrdAmt

      + Từ OM10100 or OM40200 change status từ N thành I: DocAmt = OM_SalesOrd.OrdAmt'
  - name: LineAmt
    business_meaning: 'Thành Tiền (chưa giảm trừ chiết khấu nhóm và chiết khấu chứng
      từ)

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: LineAmt = OM_PDASalesOrd.LineAmt

      + Từ OM10100 or OM40200 change status từ N thành I: LineAmt = OM_SalesOrd.LineAmt'
  - name: FreightAmt
    business_meaning: 'Phí Bảo Hiểm

      Field này luôn luôn = 0'
  - name: MiscAmt
    business_meaning: Không rõ field này
  - name: TaxAmt
    business_meaning: 'Thuế

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: TaxAmt = OM_PDASalesOrd.TaxAmt

      + Từ OM10100 or OM40200 change status từ N thành I: TaxAmt = OM_SalesOrd.TaxAmt'
  - name: SOFee
    business_meaning: 'Phí Vận Chuyển

      + Từ OM20500/Giao Hàng/Bán Hàng VanSales đẩy vào: SOFee = 0

      + Từ OM10100 or OM40200 change status từ N thành I: SOFee = OM_SalesOrd.SOFee'
  - name: CmmnAmt
    business_meaning: Không rõ field này
  - name: Crtd_Prog
    business_meaning: Tạo Tại Màn Hình
  - name: Crtd_User
    business_meaning: Người Tạo
  - name: Crtd_DateTime
    business_meaning: Ngày Tạo
  - name: LUpd_Prog
    business_meaning: Update Tại Màn Hình
  - name: LUpd_User
    business_meaning: Người Update
  - name: LUpd_DateTime
