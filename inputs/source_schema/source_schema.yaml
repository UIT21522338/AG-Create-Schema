      +Từ build eSales đẩy về: QtyOnPDA = QtyOnPDA + SL thỏa Ngân Sách

      +Từ OM20500 duyệt đơn bán không giao hàng: QtyOnPDA = QtyOnPDA - SL thỏa Ngân
