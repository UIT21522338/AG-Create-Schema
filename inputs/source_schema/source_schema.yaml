      \ Status H => Kho chuyển: không đổi, Kho nhận: không đổi\n     Hủy Status C\
      \ => Kho chuyển: tăng QtyOnHand, Kho nhận: giảm QtyOnHand\n+ Từ IN10400:\n \
      \    Status H => Điều chỉnh giảm: không đổi, Điều chỉnh tăng: không đổi\n  \
      \   Status C => Điều chỉnh giảm: giảm QtyOnHand, Điều chỉnh tăng: tăng QtyOnHand\n\
      \     Delete Status H => Điều chỉnh giảm: không đổi, Điều chỉnh tăng: không\
      \ đổi\n     Hủy Status C => Điều chỉnh giảm: tăng QtyOnHand, Điều chỉnh tăng:\
      \ giảm QtyOnHand\n+ Từ PO10200 nhập hàng:\n     Status H: không đổi\n     Status\
      \ C: tăng QtyOnHand\n     Delete lô Status H: không đổi\n     Hủy Status C:\
      \ giảm QtyOnHand\n+ Từ PO10200 trả hàng:\n     Status H: không đổi\n     Status\
      \ C: giảm QtyOnHand\n     Delete lô Status H: không đổi\n     Hủy Status C:\
      \ tăng QtyOnHand\n+ Từ OM10100 bán hàng:\n     Status N: không đổi\n     Status\
      \ I: không đổi\n     Status C: giảm QtyOnHand\n     Delete lô Status N: không\
      \ đổi\n     Hủy Status C: tăng QtyOnHand (hủy status C là chuyển C thành V)\n\
      \     Hủy Status I: không đổi (hủy status I là chuyển I thành V)\n+ Từ OM10100\
      \ trả hàng:\n     Status N: không đổi\n     Status I: không đổi\n     Status\
      \ C: tăng QtyOnHand\n     Delete lô Status N: không đổi\n     Hủy Status C:\
      \ giảm QtyOnHand (hủy status C là chuyển C thành V)\n     Hủy Status I: không\
      \ đổi (hủy status I là chuyển I thành V)"
