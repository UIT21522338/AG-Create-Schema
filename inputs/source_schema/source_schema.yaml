  - name: QtyAmtSpent
    business_meaning: 'Đã Sử Dụng

      +Từ OM10100, đơn bán hàng, lưu đơn N: QtyAmtSpent =  QtyAmtSpent + SL KM thỏa
      Ngân Sách

      +Từ OM10100, đơn bán hàng, hủy đơn N: QtyAmtSpent = QtyAmtSpent - SL KM thỏa
      Ngân Sách

      +Từ OM10100, đơn bán hàng, đơn status I và C: QtyAmtSpent = không đổi

      +Từ OM40100, OM40200 change đơn bán thành I và C: QtyAmtSpent = không đổi

      +Từ OM10100, đơn bán hàng, chuyển I thành V: QtyAmtSpent = QtyAmtSpent - SL
      KM thỏa Ngân Sách

      +Từ OM10100, đơn bán hàng, chuyển C thành V: QtyAmtSpent = QtyAmtSpent - SL
      KM thỏa Ngân Sách

      +Từ OM10100, đơn bán hàng, chuyển I thành N: QtyAmtSpent = không đổi

      +Từ OM20500 duyệt đơn bán không giao hàng: QtyAmtSpent = QtyAmtSpent + SL KM
      thỏa Ngân Sách

      +Từ OM20500 duyệt đơn bán hàng chờ giao hàng: QtyAmtSpent = QtyAmtSpent + SL
      thỏa Ngân Sách

      +Từ vansales: QtyAmtSpent = QtyAmtSpent + SL thỏa Ngân Sách

      +Từ build giao hàng thành công: QtyAmtSpent = không đổi

      +Từ OM10100, đơn trả hàng, lưu đơn N, I: QtyAmtSpent = không đổi

      +Từ OM10100, đơn trả hàng, chuyển I thành C: QtyAmtSpent = QtyAmtSpent - SL
      thỏa Ngân Sách

      +Từ OM10100, đơn trả hàng, chuyển C thành V: QtyAmtSpent = QtyAmtSpent + SL
      thỏa Ngân Sách'
  - name: Crtd_Prog
    business_meaning: Tạo Tại Màn Hình
  - name: Crtd_User
    business_meaning: Người Tạo
