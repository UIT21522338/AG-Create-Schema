      + Dòng 4: IVAT10, Tiền Trước Thuế =  4tr, Tiền Thuế = 400k

      - Lưới 2 sẽ hiển thị như sau

      + Dòng 1: IVAT05, Tiền Trước Thuế = sum các dòng IVAT05 ở lưới 1, Tiền Thuế
