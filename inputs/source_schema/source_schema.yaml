      + Tại IN10300 - chuyển 1 bước:\n       Dòng chuyển đi: lưu -1\n       Dòng nhận:\
      \ lưu 1\n+ Tại IN10300 - chuyển 2 bước:\n       Lô chuyển đi: lưu -1\n     \
      \  Lô nhận: lưu 1\n+ Tại IN10400:\n       Dòng điều chỉnh tăng: lưu 1\n    \
