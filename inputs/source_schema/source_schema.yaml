    business_meaning: "Tiền Trước Thuế (lưới 1)\n+ Từ OM20500 đẩy vào: TxblAmt00 =\
      \ OM_PDASalesOrdDet.TxblAmt00 lần vừa duyệt\n+ Từ build Giao hàng đẩy vào: TxblAmt00\
      \ = OM_PDASalesOrdDet.TxblAmt00\n+ Từ bán hàng vansales đẩy vào: TxblAmt00 =\
      \ OM_PDASalesOrdDet.TxblAmt00\n+ Từ OM10100:\n        ++ Nếu setup Trước Thuế\
      \ (SI_Tax.PrcTaxIncl = 0 và  OM_OrderType.DiscType = B) thì: \n            \
      \ TxblAmt00 = OM_SalesOrdDet.LineAmt - OM_SalesOrdDet.GroupDiscAmt1 - OM_SalesOrdDet.GroupDiscAmt2\
      \ - OM_SalesOrdDet.DocDiscAmt\n        ++ Nếu setup Sau Thuế (SI_Tax.PrcTaxIncl\
      \ = 1 và  OM_OrderType.DiscType = A) thì:\n             TxblAmt00 = (OM_SalesOrdDet.LineAmt\
      \ - OM_SalesOrdDet.GroupDiscAmt1 - OM_SalesOrdDet.GroupDiscAmt2 - OM_SalesOrdDet.DocDiscAmt)\
      \ / (1 + %Thuế)"
